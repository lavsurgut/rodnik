services:
  postgres:
    image: postgres:16
    container_name: rodnik-postgres
    environment:
      POSTGRES_USER: rodnik
      POSTGRES_PASSWORD: rodnik
      POSTGRES_DB: rodnik
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rodnik"]
      interval: 2s
      timeout: 2s
      retries: 15
